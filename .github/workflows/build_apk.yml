name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP if present
        run: |
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE"
            mkdir -p _zip_tmp
            unzip -o "$ZIP_FILE" -d _zip_tmp
            if [ -d "_zip_tmp/CellularRTMonitor_Android_Project_v4_1" ]; then
              cp -rf _zip_tmp/CellularRTMonitor_Android_Project_v4_1/. .
            else
              cp -rf _zip_tmp/. .
            fi
            rm -rf _zip_tmp
          fi

      - name: Restore Persistent Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/rtmonitor-release.jks"
            if [ ! -s "$HOME/rtmonitor-release.jks" ]; then
              echo "ERROR: Restored keystore file is empty"
              exit 1
            fi
            ls -lh "$HOME/rtmonitor-release.jks"
            echo "KS_FILE_PATH=$HOME/rtmonitor-release.jks" >> $GITHUB_ENV
          else
            echo "ERROR: KEYSTORE_B64 secret is empty"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          sudo unzip -q gradle-8.4-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CellularRTMonitor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
